name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package add-on
        shell: pwsh
        run: |
          $archive = "Mikohime-OpenAL-Addon-${{ github.ref_name }}.zip"
          Compress-Archive -Path Configure_Audio.bat, oalinst.exe, mikohime -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "$hash  $archive" | Set-Content "$archive.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Mikohime-OpenAL-Addon-${{ github.ref_name }}.zip
            Mikohime-OpenAL-Addon-${{ github.ref_name }}.zip.sha256
